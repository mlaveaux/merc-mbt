[workspace.package]
edition = "2024"
license = "BSL-1.0"
rust-version = "1.91.0"
version = "1.0.0"

# Add debug information to the release binary.
[profile.release]
lto = "thin"
panic = "abort"
debug = "line-tables-only"

[workspace]
resolver = "3"
members = [
    "crates/mbt",
    "crates/mbt_adapter",
    "tools/adapter",
    "tools/mbt",
]

[workspace.lints.rustdoc]

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
env_logger = { version = "0.11", features = ["kv"] }
log = { version = "0.4", features = ["kv"] }
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
shlex = "2.0"
tempfile = "3.27"
test-case = "3.4"
thiserror = "2.0"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

# The workspace's own crates.
merc_mbt = { path = "crates/mbt" }
merc_mbt_adapter = { path = "crates/mbt_adapter" }

# From the main merc repository
mcrl2 = { git = "https://github.com/mlaveaux/merc", rev = "b8266a94a998cddb8b4e524b0ec82b363a102880" }
merc_collections = { git = "https://github.com/mlaveaux/merc", rev = "b8266a94a998cddb8b4e524b0ec82b363a102880" }
merc_explore = { git = "https://github.com/mlaveaux/merc", rev = "b8266a94a998cddb8b4e524b0ec82b363a102880", features = ["clap"] }
merc_io = { git = "https://github.com/mlaveaux/merc", rev = "b8266a94a998cddb8b4e524b0ec82b363a102880" }
merc_lps = { git = "https://github.com/mlaveaux/merc", rev = "b8266a94a998cddb8b4e524b0ec82b363a102880" }
merc_lts = { git = "https://github.com/mlaveaux/merc", rev = "b8266a94a998cddb8b4e524b0ec82b363a102880", features = ["clap"] }
merc_tools = { git = "https://github.com/mlaveaux/merc", rev = "b8266a94a998cddb8b4e524b0ec82b363a102880" }
merc_unsafety = { git = "https://github.com/mlaveaux/merc", rev = "b8266a94a998cddb8b4e524b0ec82b363a102880" }
merc_utilities = { git = "https://github.com/mlaveaux/merc", rev = "b8266a94a998cddb8b4e524b0ec82b363a102880" }

# `merc_lps` pulls in `merc_symbolic`, which needs oxidd forked for LDD
# support; this patch must be repeated here because Cargo only honours
# [patch] from the workspace that is actually being built, not from a
# dependency pulled in transitively via git. Keep in sync with
# https://github.com/mlaveaux/merc/blob/main/tools/mcrl2/Cargo.toml's own
# [patch.crates-io] table.
[patch.crates-io]
oxidd = { git = "https://github.com/mlaveaux/oxidd", rev = "b0e524d4ef974d715894abda5b4429b319ea7f62" }
oxidd-core = { git = "https://github.com/mlaveaux/oxidd", rev = "b0e524d4ef974d715894abda5b4429b319ea7f62" }
oxidd-dump = { git = "https://github.com/mlaveaux/oxidd", rev = "b0e524d4ef974d715894abda5b4429b319ea7f62" }
oxidd-reorder = { git = "https://github.com/mlaveaux/oxidd", rev = "b0e524d4ef974d715894abda5b4429b319ea7f62" }
oxidd-rules-bdd = { git = "https://github.com/mlaveaux/oxidd", rev = "b0e524d4ef974d715894abda5b4429b319ea7f62" }
oxidd-rules-ldd = { git = "https://github.com/mlaveaux/oxidd", rev = "b0e524d4ef974d715894abda5b4429b319ea7f62" }
